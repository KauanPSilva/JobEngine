services:
  postgres:
    image: postgres:16
    container_name: job_engine_db
    environment:
      POSTGRES_DB: job_engine
      POSTGRES_USER: job
      POSTGRES_PASSWORD: job
      TZ: America/Sao_Paulo
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    ports:
      - "5432:5432"
